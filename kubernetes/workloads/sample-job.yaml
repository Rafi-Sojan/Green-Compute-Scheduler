apiVersion: batch/v1
kind: Job
metadata:
  name: sample-green-workload
  namespace: green-compute
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        workload: sample
    spec:
      restartPolicy: Never
      containers:
        - name: workload
          image: busybox:1.36
          command: ["sh", "-c", "echo sample workload completed; sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
